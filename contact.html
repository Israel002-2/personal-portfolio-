<body>
<!-- The menu and footer are added automatically by script.js -->
<main class="wrap">

<div class="page-head">
  <p class="eyebrow">Contact</p>
  <h1>Let's talk</h1>
  <p class="lead">Interested in lessons or just want to say hello? Reach out any time.</p>
</div>
<section>
  <!-- EDIT: change the text AND the link (href) if a detail changes -->
  <ul class="contact-list">
    <li><span>Email</span> <a href="mailto:israelakinyemi704@gmail.com">israelakinyemi704@gmail.com</a></li>
    <li><span>WhatsApp</span> <a href="https://wa.me/2348073171179?text=Hello%20Israel%2C%20I%27d%20like%20to%20book%20a%20maths%20lesson." target="_blank" rel="noopener">Message me</a></li>

    <li><span>Location</span> <strong>Abuja, Nigeria</strong></li>
  </ul>
  <h2>Send a message</h2>
  <p class="muted">This opens your email app with the message ready to send.</p>

    <label>Your name <input name="name" required autocomplete="name"></label>
    <label>Your email <input name="email" type="email" required autocomplete="email"></label>

  </form>
</section>
